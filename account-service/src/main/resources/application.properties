spring.application.name=account-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=${SERVER_PORT:8092}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/account_db}
spring.datasource.username=${DATABASE_USERNAME:bancoxyz}
spring.datasource.password=${DATABASE_PASSWORD:bancoxyz}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include=health,info,metrics
