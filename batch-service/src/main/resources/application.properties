spring.application.name=batch-service
server.port=8086

spring.datasource.url=jdbc:h2:file:./data/eft-batch;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

app.batch.partition.grid-size=4
app.batch.partition.threads=4
app.batch.chunk-size=100
app.batch.skip-limit=25
app.batch.retry.max-attempts=3
app.batch.retry.delay-ms=500
app.batch.recovery.enabled=true
app.batch.recovery.poll-ms=5000
app.batch.recovery.max-restarts=2

