spring.application.name=payment-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=${SERVER_PORT:8093}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payment_db}
spring.datasource.username=${DATABASE_USERNAME:bancoxyz}
spring.datasource.password=${DATABASE_PASSWORD:bancoxyz}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
topics.transacciones-completadas=bancoxyz.transacciones.completadas
topics.alertas-seguridad=bancoxyz.alertas.seguridad
services.cuentas.url=${CUENTAS_URL:http://account-service}
payment.alerta.monto-minimo=${PAYMENT_ALERT_THRESHOLD:1000000}
resilience4j.circuitbreaker.instances.cuentas.sliding-window-size=10
resilience4j.circuitbreaker.instances.cuentas.minimum-number-of-calls=5
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
