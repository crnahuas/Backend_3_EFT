spring.application.name=bff-mobile
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=${SERVER_PORT:8082}

services.clientes.url=${CLIENTES_URL:http://customer-service}
services.cuentas.url=${CUENTAS_URL:http://account-service}
services.pagos.url=${PAGOS_URL:http://payment-service}
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

resilience4j.circuitbreaker.instances.clientes.sliding-window-size=10
resilience4j.circuitbreaker.instances.cuentas.sliding-window-size=10
resilience4j.circuitbreaker.instances.pagos.sliding-window-size=10
